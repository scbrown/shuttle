[project]
name = "shuttle"
version = "0.1.0"
description = "The workflow engine of the quipu stack: signed, append-only runs exported into windowed operational graphs"
requires-python = ">=3.11"
# The ONE dependency, for ed25519 only — a documented exception to the
# sibling zero-dep doctrine (which is shantytown's, not shuttle's).
dependencies = ["cryptography>=41"]

[project.scripts]
shuttle = "shuttle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shuttle"]
